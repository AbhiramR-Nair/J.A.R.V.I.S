# App launcher whitelist — entries Jarvis is permitted to open.
#
# Three launch types:
#   exe   — raw executable path (forward slashes work on Windows)
#   shell — pre-built arg list for subprocess.Popen (e.g. PowerShell command)
#   store — Microsoft Store / MSIX app via AUMID; get IDs with Get-StartApps
#
# Add new entries here; they take effect without restarting the backend.
# Never put a path or command you haven't verified — open_app trusts this file.

apps:
  vscode:
    type: exe
    path: "D:/Microsoft VS Code/Code.exe"

  chrome:
    type: exe
    path: "C:/Program Files (x86)/Google/Chrome/Application/chrome.exe"

  cursor:
    type: store
    app_id: "Anysphere.Cursor"

  spotify:
    type: store
    app_id: "SpotifyAB.SpotifyMusic_zpdnekdrzrea0!Spotify"

  word:
    type: exe
    path: "C:/Program Files/Microsoft Office/root/Office16/WINWORD.EXE"

  excel:
    type: exe
    path: "C:/Program Files/Microsoft Office/root/Office16/EXCEL.EXE"

  powerpoint:
    type: exe
    path: "C:/Program Files/Microsoft Office/root/Office16/POWERPNT.EXE"
